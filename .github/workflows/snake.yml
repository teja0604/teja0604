name: Generate Snake Animation

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # Allows you to manually run the job at any time from the Actions tab
  workflow_dispatch:
  
  # Also run on every push to the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      # Generates a snake game from a github user contributions graph (with 5-attempt retry)
      - name: generate github-contribution-grid-snake.svg (Attempt 1)
        id: snake1
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: teja0604
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Sleep before Attempt 2
        if: steps.snake1.outcome == 'failure'
        run: sleep 45

      - name: generate github-contribution-grid-snake.svg (Attempt 2)
        id: snake2
        if: steps.snake1.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: teja0604
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Sleep before Attempt 3
        if: steps.snake2.outcome == 'failure'
        run: sleep 45

      - name: generate github-contribution-grid-snake.svg (Attempt 3)
        id: snake3
        if: steps.snake2.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: teja0604
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Sleep before Attempt 4
        if: steps.snake3.outcome == 'failure'
        run: sleep 45

      - name: generate github-contribution-grid-snake.svg (Attempt 4)
        id: snake4
        if: steps.snake3.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: teja0604
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Sleep before Attempt 5
        if: steps.snake4.outcome == 'failure'
        run: sleep 45

      - name: generate github-contribution-grid-snake.svg (Attempt 5)
        id: snake5
        if: steps.snake4.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: teja0604
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Check Snake Generation Status
        if: steps.snake1.outcome == 'failure' && steps.snake2.outcome == 'failure' && steps.snake3.outcome == 'failure' && steps.snake4.outcome == 'failure' && steps.snake5.outcome == 'failure'
        run: |
          echo "Snake generation failed after 5 attempts."
          exit 1
          
      # Push the content of <build_dir> to a branch
      # The content will be available at https://raw.githubusercontent.com/<user>/<repo>/<branch>/<file>
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
